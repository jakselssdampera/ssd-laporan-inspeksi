<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>PDF Render - SSD Inspection Report</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/form.css">
  <link rel="stylesheet" href="./css/pdf.css">
  
  <style>
    /* Reset body background for PDF */
    body { background: white !important; margin: 0; padding: 0; }
    #pdf-render-container {
      position: static !important; /* Undo the absolute positioning trick since this page is ONLY for rendering PDF */
      left: auto !important;
      top: auto !important;
      z-index: 1 !important;
      visibility: visible !important;
      display: block !important;
      padding: 0;
      margin: 0;
      width: 100%;
    }
    
    /* Ensure no page-break on items in PDF */
    .pdf-category-section { page-break-inside: avoid; }
    .pdf-item-row { page-break-inside: avoid; }
    .pdf-summary-section { page-break-inside: avoid; }
  </style>
</head>
<body>

  <!-- Render Container -->
  <div id="pdf-render-container"></div>

  <!-- Scripts -->
  <script src="./js/photo-handler.js"></script>
  <script src="./js/form-data.js"></script>
  <script src="./js/form-renderer.js"></script>
  <script src="./js/pdf-export.js"></script>
  
  <script>
    // This function is called by Puppeteer via page.evaluate()
    function renderBackendPDF(reportData, workshopData) {
      return new Promise((resolve) => {
        const container = document.getElementById('pdf-render-container');
        
        // Use the buildPDFContent function from pdf-export.js
        const html = buildPDFContent(reportData, workshopData);
        container.innerHTML = html;
        
        // Delay slightly to ensure images are loaded
        setTimeout(() => {
          resolve(true);
        }, 1000);
      });
    }
  </script>
</body>
</html>
